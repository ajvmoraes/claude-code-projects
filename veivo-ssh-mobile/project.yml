name: VeivoSSH
options:
  bundleIdPrefix: com.avs
  deploymentTarget:
    iOS: "17.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4

targets:
  VeivoSSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: ../ssh-launcher/Sources/Models
      - path: ../ssh-launcher/Sources/Storage
        excludes:
          - "TerminalAppearance.swift"
      - path: Assets.xcassets
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Citadel
        product: Citadel
      - package: NIOSSH
        product: NIOSSH
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.avs.veivossh
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "VEIVO SSH"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
